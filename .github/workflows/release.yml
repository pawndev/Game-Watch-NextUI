name: Build & Release GW.pak

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (current branch)
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Compile gw_libretro.so (Docker, tg5040 toolchain)
        run: mise run docker-build

      - name: Check the core's glibc requirement
        run: |
          MAX=$(strings -a Emus/tg5040/GW.pak/gw_libretro.so | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          echo "Max glibc required: $MAX"
          if [ "$(printf '%s\n' "$MAX" GLIBC_2.33 | sort -V | tail -1)" != "GLIBC_2.33" ]; then
            echo "ERROR: core requires $MAX, newer than the firmware's glibc (2.33)"; exit 1
          fi

      - name: Package the .pakz archive
        run: mise run package

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: GW.pak ${{ inputs.version }}
          target_commitish: ${{ github.ref_name }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            dist/*.pakz
            dist/*.pakz.sha256